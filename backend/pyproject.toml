[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tarjuman"
version = "3.0.0"
description = "Watch any video in Arabic: synced translation, natural live dubbing, dubbed MP4s. Local-first."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=2.0",
  "edge-tts>=7.0",
  "faster-whisper>=1.1",
  "piper-tts>=1.2",
  "yt-dlp",
  "imageio-ffmpeg",
  "numpy",
  "av>=12,<19",
  "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tarjuman = "tarjuman.__main__:main"

[tool.setuptools.packages.find]
include = ["tarjuman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
