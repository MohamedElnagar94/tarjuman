name: Windows installer

# Builds the app for users, with its own Python, packages, web build and extension:
#   Windows: Tarjuman-Setup-<version>.exe     Linux: Tarjuman-<version>-x86_64.AppImage
# each with a .sha256 file. Run it by hand from the Actions tab, or push a tag like v3.1.0 to publish
# both on a release, with this version's section of CHANGELOG.md as the notes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Every change to what the installers carry is built too, so there is always a fresh installer to
    # try (Actions -> this workflow -> artifacts) and a broken build shows up at once.
    branches: [main]
    paths: ["installer/**", "backend/**", "frontend/**", "extension/**", "shared/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  installer:
    name: Build the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the app folder
        shell: pwsh
        run: ./installer/build.ps1 -Python python

      - name: The bundled app starts and answers
        shell: pwsh
        run: |
          $env:TARJUMAN_HOME = Join-Path $env:RUNNER_TEMP "tarjuman-home"
          $env:TARJUMAN_NO_ENV_FILE = "1"
          $app = "build\windows\app"
          & "$app\python\python.exe" -m tarjuman doctor
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList "-m", "tarjuman", "--no-open", "--host", "127.0.0.1", "--port", "4391" -WorkingDirectory $app -PassThru
          try {
            $ok = $false
            foreach ($i in 1..60) {
              try { $h = Invoke-RestMethod "http://127.0.0.1:4391/api/health" -TimeoutSec 2; if ($h.ok) { $ok = $true; break } } catch { Start-Sleep 1 }
            }
            if (-not $ok) { throw "The bundled app did not answer on /api/health" }
            $page = Invoke-WebRequest "http://127.0.0.1:4391/" -UseBasicParsing
            if ($page.Content -notmatch "<div id=`"app`"") { throw "The web app was not served" }
          } finally { Stop-Process -Id $p.Id -Force }

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = (Get-Content build\windows\version.txt).Trim()
          & $iscc "/DAppVersion=$version" installer\tarjuman.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          # A checksum file next to the installer, so a download can be verified:
          #   (Get-FileHash Tarjuman-Setup-<version>.exe -Algorithm SHA256).Hash
          $exe = "build\windows\Tarjuman-Setup-$version.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # LF, not CRLF: `sha256sum -c` (on any system) reads the name with a stray  otherwise.
          [IO.File]::WriteAllText("$PWD\$exe.sha256", "$hash  Tarjuman-Setup-$version.exe`n")
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjuman-Setup
          path: |
            build/windows/Tarjuman-Setup-*.exe
            build/windows/Tarjuman-Setup-*.exe.sha256
          if-no-files-found: error

  linux:
    name: Build the AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the AppImage
        run: bash installer/linux/build.sh

      - name: The bundled app starts and answers
        run: |
          export TARJUMAN_HOME="$RUNNER_TEMP/tarjuman-home" TARJUMAN_NO_ENV_FILE=1
          app=build/linux/Tarjuman.AppDir
          "$app/AppRun" doctor
          "$app/AppRun" serve --no-open --host 127.0.0.1 --port 4391 &
          pid=$!
          for i in $(seq 60); do curl -fs http://127.0.0.1:4391/api/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:4391/api/health | grep -q '"app":"tarjuman"'
          curl -fs http://127.0.0.1:4391/ | grep -q '<div id="app"'
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjuman-AppImage
          path: |
            build/linux/Tarjuman-*-x86_64.AppImage
            build/linux/Tarjuman-*-x86_64.AppImage.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; v="${tag#v}"
          # The notes are this version's section of CHANGELOG.md: the app shows them before updating.
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Tarjuman $v" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "Tarjuman $v" --notes-file notes.md
          else
            gh release create "$tag" --title "Tarjuman $v" --notes-file notes.md
          fi
          ls -la out
          gh release upload "$tag" out/* --clobber
