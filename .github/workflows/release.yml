name: Windows installer

# Builds the app for users, with its own Python, packages, web build and extension:
#   Windows: Tarjuman-Setup-<version>.exe     Linux: Tarjuman-<version>-x86_64.AppImage
# each with a .sha256 file. Run it by hand from the Actions tab, or push a tag like v3.1.0 to publish
# both on a release, with this version's section of CHANGELOG.md as the notes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Every change to what the installers carry is built too, so there is always a fresh installer to
    # try (Actions -> this workflow -> artifacts) and a broken build shows up at once.
    branches: [main]
    paths: ["installer/**", "backend/**", "frontend/**", "extension/**", "shared/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  installer:
    name: Build the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the app folder
        shell: pwsh
        run: ./installer/build.ps1 -Python python

      - name: The bundled app starts and answers
        shell: pwsh
        run: |
          $env:TARJUMAN_HOME = Join-Path $env:RUNNER_TEMP "tarjuman-home"
          $env:TARJUMAN_NO_ENV_FILE = "1"
          $app = "build\windows\app"
          & "$app\python\python.exe" -m tarjuman doctor
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList "-m", "tarjuman", "--no-open", "--host", "127.0.0.1", "--port", "4391" -WorkingDirectory $app -PassThru
          try {
            $ok = $false
            foreach ($i in 1..60) {
              try { $h = Invoke-RestMethod "http://127.0.0.1:4391/api/health" -TimeoutSec 2; if ($h.ok) { $ok = $true; break } } catch { Start-Sleep 1 }
            }
            if (-not $ok) { throw "The bundled app did not answer on /api/health" }
            $page = Invoke-WebRequest "http://127.0.0.1:4391/" -UseBasicParsing
            if ($page.Content -notmatch "<div id=`"app`"") { throw "The web app was not served" }

            # 3.2: offline translation, offline voices and voice packs, on the bundled app itself.
            $B = "http://127.0.0.1:4391"; $H = @{ Origin = $B }
            $voices = Invoke-RestMethod "$B/api/voices?lang=ja"
            if (-not ($voices.voices | Where-Object { $_.id -eq "st-F1" })) { throw "No offline Japanese voice offered" }
            $wav = Invoke-WebRequest "$B/api/tts?text=%E3%81%93%E3%82%93%E3%81%AB%E3%81%A1%E3%81%AF%E3%80%82&lang=ja&voice=st-F1" -UseBasicParsing -TimeoutSec 900
            if ($wav.Headers["Content-Type"] -notmatch "audio/wav" -or $wav.RawContentLength -lt 10000) { throw "Supertonic did not speak" }
            Write-Host "Supertonic: $($wav.RawContentLength) bytes of audio/wav"
            Invoke-RestMethod -Method Post "$B/api/mt/install" -ContentType "application/json" -Body '{"pair":"en-af"}' -Headers $H | Out-Null
            $ready = $false
            foreach ($i in 1..120) {
              $mt = Invoke-RestMethod "$B/api/mt"
              if ($mt.installed -contains "en-af") { $ready = $true; break }
              if ($mt.installs."en-af".status -eq "error") { throw "Offline model failed: $($mt.installs.'en-af'.error)" }
              Start-Sleep 10
            }
            if (-not $ready) { throw "The offline translation model was not ready in 20 minutes" }
            Invoke-RestMethod -Method Post "$B/api/mt" -ContentType "application/json" -Body '{"prefer":"offline"}' -Headers $H | Out-Null
            $tr = Invoke-RestMethod -Method Post "$B/api/translate" -ContentType "application/json" -Body '{"texts":["Good morning, my friend."],"sl":"en","tl":"af"}' -Headers $H
            $out = $tr.map."Good morning, my friend."
            $health = Invoke-RestMethod "$B/api/health"
            if (-not $out -or $health.providers.lastProvider -ne "local") { throw "Offline translation did not translate" }
            Write-Host "Offline translation: $out"
          } finally { Stop-Process -Id $p.Id -Force }
          # Voice packs: the embeddable Python has no venv, so a pack installs into a folder of its own.
          & "$app\python\python.exe" -c "import pathlib, tempfile; from tarjuman.engines.packs import selftest; print(selftest(pathlib.Path(tempfile.mkdtemp())))"
          if ($LASTEXITCODE -ne 0) { throw "A voice pack could not be installed on the bundled Python" }

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = (Get-Content build\windows\version.txt).Trim()
          & $iscc "/DAppVersion=$version" installer\tarjuman.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          # A checksum file next to the installer, so a download can be verified:
          #   (Get-FileHash Tarjuman-Setup-<version>.exe -Algorithm SHA256).Hash
          $exe = "build\windows\Tarjuman-Setup-$version.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # LF, not CRLF: `sha256sum -c` (on any system) reads the name with a stray carriage return otherwise.
          [IO.File]::WriteAllText("$PWD\$exe.sha256", "$hash  Tarjuman-Setup-$version.exe`n")
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjuman-Setup
          path: |
            build/windows/Tarjuman-Setup-*.exe
            build/windows/Tarjuman-Setup-*.exe.sha256
          if-no-files-found: error

  linux:
    name: Build the AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the AppImage
        run: bash installer/linux/build.sh

      - name: The bundled app starts and answers
        run: |
          export TARJUMAN_HOME="$RUNNER_TEMP/tarjuman-home" TARJUMAN_NO_ENV_FILE=1
          app=build/linux/Tarjuman.AppDir
          "$app/AppRun" doctor
          "$app/AppRun" serve --no-open --host 127.0.0.1 --port 4391 &
          pid=$!
          for i in $(seq 60); do curl -fs http://127.0.0.1:4391/api/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:4391/api/health | grep -q '"app":"tarjuman"'
          curl -fs http://127.0.0.1:4391/ | grep -q '<div id="app"'

          # 3.2: offline translation, offline voices and voice packs, on the bundled app itself.
          B=http://127.0.0.1:4391 PY="$app/python/bin/python3"
          curl -fs "$B/api/voices?lang=ja" | grep -q '"st-F1"'
          curl -fs -o /tmp/st.wav -D /tmp/st.h --max-time 900 "$B/api/tts?text=%E3%81%93%E3%82%93%E3%81%AB%E3%81%A1%E3%81%AF%E3%80%82&lang=ja&voice=st-F1"
          grep -qi 'content-type: audio/wav' /tmp/st.h && [ "$(stat -c %s /tmp/st.wav)" -gt 10000 ]
          echo "Supertonic: $(stat -c %s /tmp/st.wav) bytes of audio/wav"
          curl -fs -X POST "$B/api/mt/install" -H "Content-Type: application/json" -H "Origin: $B" -d '{"pair":"en-af"}' > /dev/null
          for i in $(seq 120); do
            curl -fs "$B/api/mt" | "$PY" -c 'import json,sys; d=json.load(sys.stdin); e=(d["installs"].get("en-af") or {}); sys.exit(0 if "en-af" in d["installed"] else 2 if e.get("status")=="error" else 1)' && break
            [ $? -eq 2 ] && { echo "Offline model failed"; exit 1; }
            sleep 10
          done
          curl -fs "$B/api/mt" | grep -q '"en-af"'
          curl -fs -X POST "$B/api/mt" -H "Content-Type: application/json" -H "Origin: $B" -d '{"prefer":"offline"}' > /dev/null
          curl -fs -X POST "$B/api/translate" -H "Content-Type: application/json" -H "Origin: $B" -d '{"texts":["Good morning, my friend."],"sl":"en","tl":"af"}' | tee /tmp/tr.json
          curl -fs "$B/api/health" | grep -q '"lastProvider":"local"'
          kill $pid
          # Voice packs: their own environment, made with the bundled Python.
          PYTHONPATH="$app/backend" "$PY" -c "import pathlib, tempfile; from tarjuman.engines.packs import selftest; print(selftest(pathlib.Path(tempfile.mkdtemp())))"

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjuman-AppImage
          path: |
            build/linux/Tarjuman-*-x86_64.AppImage
            build/linux/Tarjuman-*-x86_64.AppImage.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; v="${tag#v}"
          # The notes are this version's section of CHANGELOG.md: the app shows them before updating.
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Tarjuman $v" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "Tarjuman $v" --notes-file notes.md
          else
            gh release create "$tag" --title "Tarjuman $v" --notes-file notes.md
          fi
          ls -la out
          gh release upload "$tag" out/* --clobber
