<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <title>Tarjuman — marquee promo tile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2E8C"/>
      <stop offset="0.5" stop-color="#121A57"/>
      <stop offset="1" stop-color="#0A0F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#3550D6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3550D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#F0922B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0922B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F0922B"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2672"/>
      <stop offset="0.45" stop-color="#3A3F9A"/>
      <stop offset="0.8" stop-color="#C9774A"/>
      <stop offset="1" stop-color="#E9A35E"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset="0.45" stop-color="#FFC46A"/>
      <stop offset="1" stop-color="#FFC46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="730" y="92" width="600" height="338" rx="22"/>
    </clipPath>
    <pattern id="lattice" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#FFD27A" stroke-width="1">
        <path d="M32 14 37 27 50 32 37 37 32 50 27 37 14 32 27 27Z"/>
        <rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)"/>
        <rect x="20" y="20" width="24" height="24"/>
      </g>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>
  <rect width="1400" height="560" fill="url(#warm)"/>
  <rect width="1400" height="560" fill="url(#lattice)" opacity="0.06"/>

  <!-- Wordmark -->
  <image href="data:image/svg+xml;base64," x="92" y="78" width="76" height="76"/>
  <text x="186" y="118" font-family="Kufi Latin, Reem Kufi, sans-serif" font-weight="600" font-size="38" fill="#F5F2EA">Tarjuman</text>
  <text x="186" y="150" font-family="Kufi Arabic, Reem Kufi, sans-serif" font-weight="600" font-size="24" fill="url(#ink)">ترجمان</text>

  <!-- Headline -->
  <text x="92" y="262" font-family="Kufi Latin, Reem Kufi, sans-serif" font-weight="600" font-size="62" fill="#F5F2EA">Watch any video</text>
  <text x="92" y="334" font-family="Kufi Latin, Reem Kufi, sans-serif" font-weight="600" font-size="62" fill="url(#ink)">in Arabic.</text>
  <text x="94" y="388" font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="400" font-size="23" fill="#AEB6DE">Synced subtitles and a natural Arabic voice,</text>
  <text x="94" y="420" font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="400" font-size="23" fill="#AEB6DE">on YouTube and almost any video site.</text>

  <!-- Chips -->
  <g font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="500" font-size="17" fill="#F5F2EA">
    <rect x="92" y="458" width="184" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="110" y="474" width="8" height="8" transform="rotate(45 114 478)" fill="#FFD27A"/>
    <text x="128" y="484">Runs on your PC</text>
    <rect x="290" y="458" width="160" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="308" y="474" width="8" height="8" transform="rotate(45 312 478)" fill="#FFD27A"/>
    <text x="326" y="484">Open source</text>
    <rect x="464" y="458" width="166" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="482" y="474" width="8" height="8" transform="rotate(45 486 478)" fill="#FFD27A"/>
    <text x="500" y="484">No account</text>
  </g>

  <!-- The video -->
  <rect x="730" y="92" width="600" height="338" rx="22" fill="#0A0F3A" filter="url(#shadow)"/>
  <g clip-path="url(#frame)">
    <rect x="730" y="92" width="600" height="338" fill="url(#sky)"/>
    <circle cx="1130" cy="300" r="120" fill="url(#sun)" opacity="0.9"/>
    <ellipse cx="900" cy="470" rx="330" ry="130" fill="#121A57"/>
    <ellipse cx="1250" cy="490" rx="360" ry="140" fill="#0A0F3A"/>
    <rect x="730" y="92" width="600" height="338" fill="url(#vignette)"/>

    <!-- Subtitles: the source line, then the translation -->
    <rect x="865" y="300" width="330" height="30" rx="7" fill="#080A1E" fill-opacity="0.78"/>
    <text x="1030" y="321" text-anchor="middle" font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="500" font-size="17" fill="#ECE8DA">And that's how the whole story began.</text>
    <rect x="838" y="336" width="384" height="48" rx="10" fill="#080A1E" fill-opacity="0.8"/>
    <text x="1030" y="369" text-anchor="middle" font-family="Plex Arabic, IBM Plex Sans Arabic, sans-serif" font-weight="700" font-size="29" fill="#FFFFFF">وهكذا بدأت الحكاية كلها</text>

    <!-- Player bar -->
    <rect x="756" y="404" width="548" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="756" y="404" width="214" height="5" rx="2.5" fill="#FFD27A"/>
    <circle cx="970" cy="406.5" r="7" fill="#FFD27A"/>
  </g>
  <rect x="730.5" y="92.5" width="599" height="337" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>

  <!-- Overlay toolbar -->
  <g transform="translate(1092 112)">
    <rect width="218" height="42" rx="14" fill="#0D1342" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <image href="data:image/svg+xml;base64," x="10" y="9" width="24" height="24"/>
    <g fill="none" stroke="#E8E6F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="50" y="12" width="20" height="16" rx="3.5" stroke="#FFD27A"/>
      <path d="M54.5 23h4.5M63 23h2.5M54.5 18.5h2.5M61 18.5h4.5" stroke="#FFD27A"/>
      <path d="M86 28 91 14l5 14M88 23.5h6M100 21h7"/>
      <path d="M120 28 125 14l5 14M122 23.5h6M134 21h7M137.5 17.5v7"/>
      <path d="M156 17v8M161 13v16M166 15v12M171 19v4" stroke="#FFD27A"/>
      <path d="M190 15l11 11M201 15l-11 11"/>
    </g>
  </g>
</svg>
