<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <title>Tarjuman — small promo tile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2E8C"/>
      <stop offset="0.55" stop-color="#121A57"/>
      <stop offset="1" stop-color="#0A0F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.75">
      <stop offset="0" stop-color="#3550D6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3550D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F0922B"/>
    </linearGradient>
    <pattern id="lattice" width="44" height="44" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#FFD27A" stroke-width="1">
        <path d="M22 9 25.5 18.5 35 22 25.5 25.5 22 35 18.5 25.5 9 22 18.5 18.5Z"/>
        <rect x="13.5" y="13.5" width="17" height="17" transform="rotate(45 22 22)"/>
        <rect x="13.5" y="13.5" width="17" height="17"/>
      </g>
    </pattern>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#glow)"/>
  <rect width="440" height="280" fill="url(#lattice)" opacity="0.07"/>

  <image href="{{ICON}}" x="30" y="34" width="86" height="86"/>
  <text x="134" y="76" font-family="Kufi Latin, Reem Kufi, sans-serif" font-weight="600" font-size="40" fill="#F5F2EA">Tarjuman</text>
  <text x="134" y="114" font-family="Kufi Arabic, Reem Kufi, sans-serif" font-weight="600" font-size="28" fill="url(#ink)">ترجمان</text>

  <text x="32" y="166" font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="500" font-size="20" fill="#F5F2EA">Arabic subtitles &amp; live dubbing</text>
  <text x="32" y="192" font-family="Plex Latin, IBM Plex Sans Arabic, sans-serif" font-weight="400" font-size="17" fill="#AEB6DE">for any video, on your own computer</text>

  <rect x="32" y="218" width="376" height="38" rx="9" fill="#080A1E" fill-opacity="0.82"/>
  <rect x="32" y="218" width="4" height="38" rx="2" fill="url(#ink)"/>
  <text x="220" y="244" text-anchor="middle" font-family="Plex Arabic, IBM Plex Sans Arabic, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">وهكذا بدأت الحكاية كلها</text>
</svg>
